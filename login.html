<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เข้าสู่ระบบ - ระบบจองรถ</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='bootstrap.min.css') }}">
</head>
<body class="bg-light">
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-sm-12">
            <div class="card shadow">
                <div class="card-body">
                    <h3 class="text-center mb-4">เข้าสู่ระบบจองรถ</h3>
                    {% if get_flashed_messages() %}
                        <div class="alert alert-danger">{{ get_flashed_messages()[0] }}</div>
                    {% endif %}
                    <form method="POST">
                        <div class="mb-3">
                            <label>รหัสพนักงาน (4 หลัก)</label>
                            <input type="text" name="emp_id" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label>รหัสผ่าน (เลขท้ายบัตร ปชช. 4 หลัก)</label>
                            <input type="password" name="pin" class="form-control" required>
                        </div>
                        <button type="submit" class="btn btn-primary w-100">เข้าสู่ระบบ</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
